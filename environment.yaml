name: SSIR
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 3.10 and NumPy 1.x are required because scripts/map/leo_coords.py
  # imports poliastro, whose current conda-forge builds depend on astropy<6.
  - python=3.10
  - pip
  - setuptools
  - wheel

  # Core SSIR runtime and experiment scripts.
  - numpy>=1.26,<2
  - pandas>=2.2
  - geopandas>=1.0
  - matplotlib>=3.8
  - shapely>=2.0
  - scipy>=1.10
  - scikit-learn>=1.4
  - networkx>=3.2
  - tqdm>=4.66
  - requests>=2.32
  - python-dateutil>=2.9
  - urllib3>=2.2
  - pygad>=3.3

  # Map/orbit helper scripts.
  - astropy<6
  - poliastro=0.17

  - pip:
      # RL/GNN scripts. For CPU-only installs, remove the next line and use
      # torch==2.6.0 instead of torch==2.6.0+cu124.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torch-geometric==2.6.1
      - svgpathtools>=1.6
      - svgpath2mpl>=1.0
